appId: com.rejections.tracker
---
- launchApp
- assertVisible:
    text: "rejections this year"
    timeout: 10000
- tapOn: "E2E Test Rejection"
- clearText: "What were you rejected from?"
- tapOn: "What were you rejected from?"
- inputText: "E2E Updated Rejection"
- tapOn: "Save Changes"
- assertVisible:
    text: "E2E Updated Rejection"
    timeout: 5000
